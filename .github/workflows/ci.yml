name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test, build, and verify
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up IntelliJ Platform
        uses: ./.github/actions/setup-intellij

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic

      - name: Test and build plugin
        run: ./gradlew --no-daemon test buildPlugin verifyPluginStructure

      - name: Verify binary compatibility
        run: .github/scripts/verify-plugin.sh

      - name: Upload plugin distribution
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: go-lsp-intellij-${{ github.sha }}
          path: build/distributions/*.zip
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-reports-${{ github.sha }}
          path: |
            build/reports/tests/
            build/reports/pluginVerifier/
            build/reports/problems/
          if-no-files-found: ignore
          retention-days: 14
