name: Setup IntelliJ Platform
description: Download the pinned IntelliJ IDEA build and expose its bundled Java runtime

inputs:
  version:
    description: IntelliJ IDEA version
    required: false
    default: "2026.2.2"
  sha256:
    description: SHA-256 checksum of the Linux IntelliJ IDEA archive
    required: false
    default: f1cc5329a7adf3ab3bd8886744103f7d3bcf1ca12e699762ecd9bffe57335f8b

runs:
  using: composite
  steps:
    - name: Cache IntelliJ IDEA archive
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/intellij-platform/ideaIU-${{ inputs.version }}.tar.gz
        key: intellij-idea-${{ runner.os }}-${{ runner.arch }}-${{ inputs.version }}-${{ inputs.sha256 }}

    - name: Install IntelliJ IDEA and Java 25
      shell: bash
      env:
        IDEA_VERSION: ${{ inputs.version }}
        IDEA_SHA256: ${{ inputs.sha256 }}
      run: |
        set -euo pipefail

        archive="$HOME/.cache/intellij-platform/ideaIU-$IDEA_VERSION.tar.gz"
        install_dir="$RUNNER_TEMP/intellij-platform-$IDEA_VERSION"
        mkdir -p "$(dirname "$archive")" "$install_dir"

        if [[ ! -f "$archive" ]]; then
          curl --fail --location --retry 3 --output "$archive" \
            "https://download.jetbrains.com/idea/ideaIU-$IDEA_VERSION.tar.gz"
        fi

        printf '%s  %s\n' "$IDEA_SHA256" "$archive" | sha256sum --check --status
        tar --extract --gzip --file "$archive" --directory "$install_dir"

        shopt -s nullglob
        installations=("$install_dir"/idea-*)
        if [[ ${#installations[@]} -ne 1 ]]; then
          printf 'Expected one IntelliJ IDEA installation, found %s\n' "${#installations[@]}" >&2
          exit 1
        fi

        idea_home="${installations[0]}"
        java_home="$idea_home/jbr"
        [[ -x "$java_home/bin/java" ]]

        printf 'INTELLIJ_PLATFORM_PATH=%s\n' "$idea_home" >> "$GITHUB_ENV"
        printf 'JAVA_HOME=%s\n' "$java_home" >> "$GITHUB_ENV"
        printf '%s\n' "$java_home/bin" >> "$GITHUB_PATH"
